# Local OSRA instance. The secret is supplied by SEARXNG_SECRET at start.
use_default_settings: true

general:
  debug: false
  instance_name: "OSRA local search"

search:
  formats:
    - html
    - json

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
