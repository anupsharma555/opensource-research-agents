name: osra-searxng

services:
  search:
    image: ${OSRA_SEARXNG_IMAGE:?Set a reviewed SearXNG image digest in the ignored env file}
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      SEARXNG_SECRET: ${OSRA_SEARXNG_SECRET:?Set a local secret in the ignored env file}
      SEARXNG_BASE_URL: http://127.0.0.1:18081/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: "no"
