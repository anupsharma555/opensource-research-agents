name: Offline foundation

on:
  push:
    branches: [main, verification/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.21
      - name: Install and verify offline document readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
          for tool in pdftotext pdfinfo pdftoppm tesseract; do
            command -v "$tool"
          done
          tesseract --list-langs | python -c "import sys; assert 'eng' in sys.stdin.read().splitlines()"
          dpkg-query -W poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install the committed dependency set
        run: scripts/dev setup --observability
      - name: Verify offline contracts, skills, behavior and React
        env:
          PYTEST_ADDOPTS: "-x --tb=short"
        run: scripts/dev check
      - name: Exercise the portable repository skill helper
        run: .venv/bin/python .agents/skills/os-check-foundation/scripts/check.py --mode smoke
      - name: Install the pinned browser and its OS prerequisites
        run: scripts/dev browser-install --with-deps
      - name: Verify the synthetic Atlas browser journeys
        run: scripts/dev browser
      - name: Review intended tracked content
        run: .venv/bin/python scripts/check-publication.py
