[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "opensource-research-agents"
version = "0.1.0"
description = "Persistent healthcare research agents for literature discovery, evidence synthesis, and peer review in a shared visual workspace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
ora = "ora.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
required-version = "==0.9.21"
